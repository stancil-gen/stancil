project: error_suite
version: 1
lang: go
framework: gin
db:
  - name: postgres
    driver: postgres
    framework: gorm
    url: ${DATABASE_URL}

# 1. Config Duplication & Missing Config for URL
config:
  - name: STRIPE_KEY
    type: str
  - name: STRIPE_KEY # DUPLICATE_CONFIG
    type: str

types:
  # 2. Circular Dependency: A -> B -> A
  - name: TypeA
    fields:
      - name: link
        type: TypeB
  - name: TypeB
    fields:
      - name: link
        type: TypeA

  # 3. Duplicate Type
  - name: Money
    fields:
      - name: amt
        type: decimal
  - name: Money # DUPLICATE_TYPE
    fields:
      - name: amt
        type: decimal

tables:
  - name: users
    fields:
      - name: id
        type: uuid
        required: true
      - name: secret_code
        type: str
        private: true # Used for leak detection
      - name: status
        type: enum
        values: [pending, active, archived]

    # State Machine (valid — tests reachability)
    states:
      field: status
      transitions:
        - from: pending
          to: active

  - name: orders
    fields:
      - name: id
        type: uuid
      - name: total
        type: UnknownType # UNKNOWN_TYPE

  - name: orders # DUPLICATE_TABLE
    fields:
      - name: id
        type: uuid

externals:
  - name: stripe
    base_url: https://api.stripe.com/v1/${UNDEFINED_VAR} # UNDEFINED_CONFIG
    calls:
      - name: charge
        method: POST
        path: /charges

resources:
  - group: billing
    apis:
      - name: SecretAPI
        method: POST
        path: /secret

        steps:
          - id: step_one
            touch:
              table: non_matching_table # UNKNOWN_TABLE
          - id: step_one # DUPLICATE_STEP_ID
            touch:
              table: users

        # Privacy Leak
        dtos:
          response:
            fields:
              - name: secret_code # LEAK: maps to private field in 'users'
                type: str

      - name: EmptyAPI # API_NO_STEPS
        method: GET
        path: /empty
        steps: []
